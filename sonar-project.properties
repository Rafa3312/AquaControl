# Configuración de análisis para SonarQube Cloud (https://sonarcloud.io)
# Verifica que organization y projectKey coincidan con los que muestra
# SonarQube Cloud en Information del proyecto.
sonar.organization=rafa3312
sonar.projectKey=Rafa3312_AquaControl
sonar.projectName=AquaControl

# Código de la app Flutter (el firmware C++ no se analiza aquí)
sonar.sources=app/lib
sonar.tests=app/test
sonar.sourceEncoding=UTF-8

# Cobertura generada con `flutter test --coverage`
sonar.dart.lcov.reportPaths=app/coverage/lcov.info

# El paso de análisis falla si el Quality Gate falla (fail fast)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
