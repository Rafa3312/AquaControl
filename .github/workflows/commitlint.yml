name: Commit & PR title rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages (Conventional Commits)
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.mjs

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci

  # Alerta al canal de Discord del equipo si las reglas no se cumplen.
  notify-failure:
    needs: [commitlint, pr-title]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify-discord.yml
    with:
      results: ${{ toJSON(needs) }}
    secrets: inherit
