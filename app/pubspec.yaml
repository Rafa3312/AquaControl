name: irrigation_app
description: AquaControl - Sistema de Riego Inteligente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.1
  cupertino_icons: ^1.0.8
  
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  shared_preferences: ^2.3.0
  
  # HTTP / red
  http: ^1.2.0

  provider: ^6.1.2

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.0

  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/video/splash_video.mp4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

