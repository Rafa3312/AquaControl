name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # google-services.json no se versiona (repo público). Si el secreto
      # GOOGLE_SERVICES_JSON existe, se recrea para poder compilar el APK.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Falla solo con errores. Warnings/infos heredados del código base se
      # atienden como deuda técnica (ver docs/sprints/README.md).
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Restore google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build debug APK
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: flutter build apk --debug

      - name: Upload APK
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
